<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MH - Log In</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{min-height:100vh;background:url('1794603017686.jpg') center/cover no-repeat;display:flex;align-items:center;justify-content:center;padding:20px}
  body::before{content:'';position:fixed;inset:0;background:rgba(2,5,30,0.78)}
  .box{position:relative;width:100%;max-width:360px;background:rgba(255,255,255,0.08);backdrop-filter:blur(12px);border:1px solid rgba(255,215,0,0.4);padding:28px;border-radius:22px;text-align:center;color:#fff}
  .logo{font-size:42px;font-weight:900;background:linear-gradient(#ffd700,#ff9d00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .sub{font-size:11px;letter-spacing:3px;color:#ccc}
  h2{margin:18px 0 6px}
  p{color:#bbb;font-size:13px;margin-bottom:18px}
  input{width:100%;padding:14px;margin-bottom:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.4);color:#fff;outline:none}
  button{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(#ffd700,#ff9d00);font-weight:bold;font-size:16px}
  a{color:#00e5ff;text-decoration:none;font-size:13px}
  .links{margin-top:16px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="box">
  <div class="logo">MH</div>
  <div class="sub">MODERN EARNING PLATFORM</div>
  <h2>Welcome Back</h2>
  <p>Log In to continue earning</p>
  <input type="text" placeholder="Phone Number">
  <input type="password" placeholder="Password">
  <button>Log In</button>
  <div class="links"><a href="index.html">← Back</a><a href="signup.html">Create Account</a></div>
</div>
</body>
</html>
