<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MH - Log In</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{min-height:100vh;background:url('1794603017686.jpg') center/cover no-repeat;display:flex;align-items:center;justify-content:center;padding:20px}
  body::before{content:'';position:fixed;inset:0;background:rgba(2,5,30,0.78)}
  .box{position:relative;width:92%;max-width:420px;background:rgba(255,255,255,0.08);backdrop-filter:blur(12px);border:1px solid rgba(255,215,0,0.4);padding:32px;border-radius:22px;text-align:center;color:#fff}
  .logo{font-size:48px;font-weight:900;background:linear-gradient(#ffd700,#ff9d00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .sub{font-size:11px;letter-spacing:3px;color:#ccc}
  h2{margin:20px 0 6px;font-size:24px}
  p{color:#bbb;font-size:14px;margin-bottom:20px}
  input{width:100%;padding:16px;margin-bottom:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.4);color:#fff;outline:none;font-size:16px}
  button{width:100%;padding:16px;border:none;border-radius:12px;background:linear-gradient(#ffd700,#ff9d00);font-weight:bold;font-size:17px;cursor:pointer}
  a{color:#00e5ff;text-decoration:none;font-size:14px}
  .links{margin-top:18px;display:flex;justify-content:space-between}
  #msg{font-size:14px;margin-top:12px;min-height:20px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">MH</div>
  <div class="sub">MODERN EARNING PLATFORM</div>
  <h2>Welcome Back</h2>
  <p>Log in to your MH account</p>
  <input id="email" type="email" placeholder="Gmail Address">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="doLogin()">Log In</button>
  <div id="msg"></div>
  <div class="links"><a href="index.html">← Back</a><a href="signup.html">Don't have account? Sign Up</a></div>
</div>
<script>
function doLogin(){
  var email=document.getElementById('email').value.trim().toLowerCase();
  var pass=document.getElementById('pass').value.trim();
  var msg=document.getElementById('msg');
  if(!email || !pass){ msg.style.color='red'; msg.innerText='Please fill Gmail and Password!'; return; }
  var data = localStorage.getItem('mh_user_' + email);
  if(!data){ msg.style.color='red'; msg.innerText='No account found! Please Sign Up first.'; return; }
  var user = JSON.parse(data);
  if(user.pass !== pass){ msg.style.color='red'; msg.innerText='Wrong Password!'; return; }
  localStorage.setItem('mh_login', email);
  msg.style.color='#00ff88'; msg.innerText='Login Success! Going to Dashboard...';
  setTimeout(()=>{ window.location.href='dashboard.html'; }, 800);
}
</script>
</body>
</html>
