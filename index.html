<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MH - Welcome</title>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #000;
    overflow: hidden;
    display: grid;
    place-items: center;
  }

  .welcome {
    position: relative;
    width: 100vw;
    height: 100dvh;
    max-width: 100vw;
    max-height: 100dvh;
    overflow: hidden;
  }

  .welcome img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .click-area {
    position: absolute;
    display: block;
    height: 4.5%;
    border-radius: 40px;
    /* background: rgba(255,0,0,0.3); - টেস্ট করার জন্য চাইলে এই লাইনটা চালু করতে পারো */
  }

  .login {
    top: 82.5%;
    left: 33%;
    width: 34%;
  }

  .signup {
    top: 88%;
    left: 27%;
    width: 46%;
  }
</style>
</head>

<body>
<div class="welcome">
  <img src="1794603017686.jpg" alt="MH Welcome Banner">

  <a class="click-area login"
     href="login.html"
     aria-label="Log In"></a>

  <a class="click-area signup"
     href="signup.html"
     aria-label="Sign Up"></a>
</div>
</body>
</html>
