
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MH - Welcome</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

.welcome {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
}

.welcome img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
    z-index: 1;
    pointer-events: none;
}

.click-area {
    position: absolute;
    display: block;
    z-index: 2;
    height: 8%;
    cursor: pointer;
}

/* LOGIN BUTTON */
.login {
    top: 64.5%;
    left: 53%;
    width: 37%;
}

/* SIGN UP BUTTON */
.signup {
    top: 64.5%;
    left: 10%;
    width: 38%;
}

</style>
</head>

<body>

<div class="welcome">

    <img src="welcome.png">" alt="MH Welcome Banner">

    <a class="click-area login"
       href="login.html"
       aria-label="Log In"></a>

    <a class="click-area signup"
       href="signup.html"
       aria-label="Sign Up"></a>

</div>

</body>
</html>
