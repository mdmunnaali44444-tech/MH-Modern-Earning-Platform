
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MH | Modern Earning Platform</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #030b19;
}
.welcome {
  position: relative;
  width: 100%;
  max-width: 1000px;
  margin: 0 auto;
}
.welcome img {
  display: block;
  width: 100%;
  height: auto;
}
.click-area {
  position: absolute;
  top: 83.5%;
  height: 8.5%;
  display: block;
  border-radius: 40px;
}
.login {
  left: 31.3%;
  width: 18.3%;
}
.signup {
  left: 50.8%;
  width: 25.4%;
}
.click-area:focus-visible {
  outline: 3px solid white;
}
</style>
</head>
<body>
<div class="welcome">
  <img src="mh-welcome-banner.png" alt="Welcome to MH Modern Earning Platform">
  <a class="click-area login" href="login.html" aria-label="Log In"></a>
  <a class="click-area signup" href="signup.html" aria-label="Create Account or Sign Up"></a>
</div>
</body>
</html>
