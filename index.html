<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MH | Modern Earning Platform</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: #030916;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px;
}

.welcome {
  width: 100%;
  max-width: 1100px;
  text-align: center;
  padding: 35px 20px;
  border: 1px solid #087cff;
  border-radius: 22px;
  background: linear-gradient(145deg,#07152d,#020714);
  box-shadow: 0 0 35px #006aff35;
}

.logo {
  font-size: 55px;
  font-weight: 900;
  color: #08baff;
  text-shadow: 0 0 20px #008cff;
}

.subtitle {
  color: #b5c9e9;
  margin: 8px 0 22px;
}

.banner {
  width: 100%;
  max-width: 850px;
  height: auto;
  display: block;
  margin: 0 auto 25px;
  border-radius: 15px;
  border: 1px solid #087cff;
}

h1 {
  font-size: clamp(25px,5vw,42px);
  margin-bottom: 15px;
}

h1 span {
  color: #08baff;
}

.description {
  color: #bdcde5;
  line-height: 1.7;
  margin-bottom: 28px;
}

.buttons {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 15px;
}

.btn {
  text-decoration: none;
  padding: 15px 35px;
  border-radius: 35px;
  font-size: 16px;
  font-weight: bold;
  transition: .3s;
}

.login {
  background: linear-gradient(90deg,#087cff,#00c8ff);
  color: white;
}

.signup {
  border: 2px solid #08aaff;
  color: white;
}

.btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 0 20px #008cff;
}

.footer {
  color: #56caff;
  margin-top: 30px;
  font-size: 13px;
}

@media(max-width:600px) {
  .welcome {
    padding: 25px 13px;
  }

  .btn {
    width: 100%;
    max-width: 300px;
  }
}
</style>
</head>

<body>

<div class="container">
  <main class="welcome">

    <div class="logo">MH</div>

    <p class="subtitle">
      MODERN EARNING PLATFORM
    </p>

    <img
      class="banner"
      src="assets/welcome-banner.png"
      alt="Welcome to MH"
    >

    <h1>Welcome to <span>MH</span></h1>

    <p class="description">
      Discover Opportunities. Complete Tasks. Earn Rewards.<br>
      Your Journey Starts Here!
    </p>

    <div class="buttons">
      <a href="login.html" class="btn login">
        Log In
      </a>

      <a href="signup.html" class="btn signup">
        Create Account / Sign Up
      </a>
    </div>

    <div class="footer">
      MH — Modern Earning Platform
    </div>

  </main>
</div>

</body>
</html>
