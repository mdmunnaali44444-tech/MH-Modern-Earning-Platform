
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MH | Modern Earning Platform</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #030b19;
}

body {
  display: grid;
  place-items: center;
}

.welcome {
  position: relative;
  width: fit-content;
  height: fit-content;
  max-width: 100vw;
  max-height: 100dvh;
}

.welcome img {
  display: block;
  width: auto;
  height: auto;
  max-width: 100vw;
  max-height: 100dvh;
}

.click-area {
  position: absolute;
  display: block;
  height: 8.5%;
  border-radius: 40px;
}

.login {
  top: 83.5%;
  left: 31.3%;
  width: 18.3%;
}

.signup {
  top: 83.5%;
  left: 50.8%;
  width: 25.4%;
}
</style>
</head>

<body>
<div class="welcome">
  <img src="1794603017686.jpg" alt="MH Welcome Banner" style="width:100%; border-radius:12px; margin-top:10px;">

  <a class="click-area login"
     href="login.html"
     aria-label="Log In"></a>

  <a class="click-area signup"
     href="signup.html"
     aria-label="Sign Up"></a>
</div>
</body>
</html>
