<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MH - Welcome</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }

  .welcome {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
  }

  .welcome img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
  }

  .click-area {
    position: absolute;
    display: block;
    height: 4.5%;
  }
  .login {
    top: 82.5%;
    left: 33%;
    width: 34%;
  }
  .signup {
    top: 88%;
    left: 27%;
    width: 46%;
  }
</style>
</head>
<body>
<div class="welcome">
  <img src="1794603017686.jpg" alt="MH Welcome Banner">
  <a class="click-area login" href="login.html" aria-label="Log In"></a>
  <a class="click-area signup" href="signup.html" aria-label="Sign Up"></a>
</div>
</body>
</html>
