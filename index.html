
<!DOCTYPE html>

<head>

<style>
* {
  margin: 0;

}
html, body {

}
.welcome {
  position: relative;

  position: absolute;
  display: block;
  height: 8.5%;
  border-radius: 40px;
}
.login {
  top: 83.5%;
  left: 31.3%;

}
.signup {
  top: 83.5%;

  width: 25.4%;

</head>
<body>
<div class="welcome">
  <img src="mh-welcome-banner.png" alt="MH Welcome">
  <a class="click-area login" href="login.html" aria-label="Log In"></a>
  <a class="click-area signup" href="signup.html" aria-label="Sign Up"></a>

</html>
