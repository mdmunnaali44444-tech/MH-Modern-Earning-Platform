<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balance - MH Platform</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#070b14;color:#fff;min-height:100vh}
.top{background:rgba(255,255,255,0.05);padding:16px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.08);position:sticky;top:0}
.top a{color:#fff;text-decoration:none;font-weight:600}
.main{padding:18px}
.balance-card{background:linear-gradient(135deg,#0f172a 0%,#1e293b 45%,#b45309 100%);border:1px solid rgba(251,191,36,0.35);border-radius:22px;padding:26px 22px}
.balance-card small{color:#fcd34d;letter-spacing:1px;font-weight:700;font-size:12px}
.balance-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.balance-row h1{font-size:44px;font-weight:800}
.balance-row h1 span{font-size:26px;color:#fbbf24}
.refresh-btn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.12);color:#fff;font-size:18px;cursor:pointer}
#user{margin-top:12px;color:#cbd5e1;font-size:13px}
#debug{margin-top:10px;background:#000;padding:10px;border-radius:10px;color:#fbbf24;font-size:12px;word-break:break-all;white-space:pre-wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.mini{background:#111827;border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:18px 14px}
.mini p{color:#9ca3af;font-size:12px}
.mini h2{font-size:22px;margin-top:4px}
</style>
</head>
<body>
<div class="top"><a href="dashboard.html">← Back</a><b>💰 My Balance</b><span style="width:40px"></span></div>
<div class="main">
  <div class="balance-card">
    <small>TOTAL BALANCE</small>
    <div class="balance-row"><h1><span>৳</span> <span id="bal">Loading...</span></h1><button class="refresh-btn" onclick="location.reload()">↻</button></div>
    <p id="user">Loading...</p>
    <p id="debug">Checking...</p>
  </div>
  <div class="grid">
    <div class="mini"><p>আজকের ইনকাম</p><h2>৳ <span id="todayBal">0</span></h2></div>
    <div class="mini"><p>গতকালের ইনকাম</p><h2>৳ <span id="yestBal">0</span></h2></div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBEeIVyP44rJE8QkmumMNWj8CeKlAjr9hg",
  authDomain: "mh-modern-earning-platform.firebaseapp.com",
  projectId: "mh-modern-earning-platform",
  storageBucket: "mh-modern-earning-platform.firebasestorage.app",
  messagingSenderId: "743565295091",
  appId: "1:743565295091:web:fdaf5dc868a38e24a6a686",
  measurementId: "G-WZMYQ9M3W4"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
function toNum(v){
  if(v===undefined||v===null||v==="") return 0;
  if(typeof v==="number") return v;
  let n = parseFloat(String(v).replace(/[^0-9.-]/g,""));
  return isNaN(n)?0:n;
}
auth.onAuthStateChanged(async (user)=>{
  if(!user){ document.getElementById('bal').innerText="Login First"; return; }
  document.getElementById('user').innerText = user.email;
  document.getElementById('debug').innerText = "UID: " + user.uid + "\nEmail: " + user.email;
  try{
    let doc = await db.collection('users').doc(user.uid).get();
    if(doc.exists){
      let d=doc.data();
      document.getElementById('debug').innerText += "\nUID Doc FOUND\nRaw Data: " + JSON.stringify(d);
      document.getElementById('bal').innerText = toNum(d.balance).toLocaleString('en-IN');
      document.getElementById('todayBal').innerText = toNum(d.todayIncome||d.today_income||0).toLocaleString('en-IN');
      document.getElementById('yestBal').innerText = toNum(d.yesterdayIncome||d.yesterday_income||0).toLocaleString('en-IN');
      return;
    } else {
      document.getElementById('debug').innerText += "\nUID Doc NOT FOUND, trying email...";
    }
  }catch(e){
    document.getElementById('debug').innerText += "\nUID ERR: " + e.message;
  }
  try{
    const q = await db.collection('users').where('email','==',user.email).get();
    document.getElementById('debug').innerText += "\nEmail Query Found: " + q.size + " docs";
    if(!q.empty){
      let d=q.docs[0].data();
      document.getElementById('debug').innerText += "\nEmail Doc ID: " + q.docs[0].id + "\nRaw Data: " + JSON.stringify(d);
      document.getElementById('bal').innerText = toNum(d.balance).toLocaleString('en-IN');
    }
  }catch(e){
    document.getElementById('debug').innerText += "\nEmail ERR: " + e.message;
  }
});
</script>
</body>
</html>
